<text x="48" y="704" fill="#3F3F3A" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13">Every source is a public Hyperliquid endpoint. State between sweeps lives in committed JSON, so a fresh checkout reproduces the plate.</text>
<text x="48" y="724" fill="#3F3F3A" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13">Budget: 1,200 weight per minute per IP. A routine sweep spends about 1,150; the daily backtest about 3,600, spread over three minutes.</text>
