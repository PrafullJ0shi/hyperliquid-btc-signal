    <line x1="186" y1="-150" x2="194" y2="-150" stroke="#141414" stroke-width="1"/>
    <text x="202" y="154" fill="#141414" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11">0.00</text>
