  <line x1="520" y1="110" x2="520" y2="500" stroke="#B7B3A9" stroke-width="1"/>

  <text x="568" y="200" fill="#141414" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="42" font-weight="500">Bitcoin positioning among</text>
  <text x="568" y="252" fill="#141414" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="42" font-weight="500">Hyperliquid one-month leaders</text>
  <text x="568" y="304" fill="#141414" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="20">A public-data instrument for a single reading: long, short, or</text>
  <text x="568" y="332" fill="#141414" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="20">neutral on Bitcoin, with a stated interval and a sample size.</text>
  <text x="568" y="370" fill="#8C1D12" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="2">FIG. 1  ·  CONSENSUS INCLINATION</text>
  <text x="568" y="430" fill="#3F3F3A" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16">The accent ring tilts toward LONG as weighted P(long) rises. This is not financial advice and not a forecast.</text>

  <line x1="64" y1="500" x2="1536" y2="500" stroke="#141414" stroke-width="1"/>
  <text x="64" y="528" fill="#3F3F3A" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">PRAFULL JOSHI  ·  MIT LICENSE  ·  HYPERLIQUID PUBLIC API ONLY</text>
