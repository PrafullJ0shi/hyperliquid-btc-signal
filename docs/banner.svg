  <text x="64" y="56" fill="#141414" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3.2">HL–BTC–SIG  ·  REV 0.1  ·  PUBLIC MARKET DATA</text>
  <text x="1536" y="56" text-anchor="end" fill="#3F3F3A" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">OPEN SOURCE</text>

