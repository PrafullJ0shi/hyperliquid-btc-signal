<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="Bitcoin positioning among Hyperliquid one-month leaders.">
  <title>HL–BTC–SIG — Bitcoin positioning among Hyperliquid one-month leaders</title>
  <rect width="1600" height="560" fill="#EFECE6"/>
  <!-- registration marks -->
  <path d="M24 24h22M24 24v22" stroke="#141414" stroke-width="1" fill="none"/>
  <path d="M1576 24h-22M1576 24v22" stroke="#141414" stroke-width="1" fill="none"/>
  <path d="M24 536h22M24 536v-22" stroke="#141414" stroke-width="1" fill="none"/>
